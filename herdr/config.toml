onboarding = false

[keys]
prefix = "ctrl+space"
next_agent = "prefix+a"
remove_worktree = "prefix+d"
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
navigate_pane_left = ["h", "ctrl+h"]
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = ["l", "ctrl+l"]
focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["prefix+j", "ctrl+j"]
focus_pane_up = ["prefix+k", "ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

[ui.sound]
enabled = false

[theme]
name = "nord"
auto_switch = false
